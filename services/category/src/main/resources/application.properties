spring.application.name=category
server.port=8081
spring.config.import=optional:configserver:${CONFIG_URL:http://localhost:8888}
spring.datasource.url=jdbc:h2:mem:category
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
labtest.base-url=http://lab-test

eureka.client.service-url.defaultZone=${DISCOVERY_URL:http://localhost:8761/eureka}
eureka.instance.instance-id=${INSTANCE_ID:category-local}
