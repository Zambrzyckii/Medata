spring.application.name=gateway
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=lab-test-nested
spring.cloud.gateway.server.webflux.routes[0].uri=lb://lab-test
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/categories/*/tests

spring.cloud.gateway.server.webflux.routes[1].id=category
spring.cloud.gateway.server.webflux.routes[1].uri=lb://category
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/categories/**

spring.cloud.gateway.server.webflux.routes[2].id=lab-test
spring.cloud.gateway.server.webflux.routes[2].uri=lb://lab-test
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/tests/**

eureka.client.service-url.defaultZone=${DISCOVERY_URL:http://localhost:8761/eureka}
eureka.instance.instance-id=${INSTANCE_ID:gateway-local}
