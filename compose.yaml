name: medata

services:
  web:
    build: ./web/catalog
    ports:
      - "4200:80"
    environment:
      GATEWAY_URL: http://gateway:8080
    depends_on:
      gateway:
        condition: service_started

  gateway:
    build: ./services/gateway
    ports:
      - "8080:8080"
    environment:
      DISCOVERY_URL: http://discovery:8761/eureka
      INSTANCE_ID: gateway-1
      # Faster local-registry refresh (default 30s): shrinks the cold-start
      # window in which lb:// routes and event publishing see no instances
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
    depends_on:
      discovery:
        condition: service_started
      category:
        condition: service_started
      lab-test-1:
        condition: service_started
      lab-test-2:
        condition: service_started

  discovery:
    build: ./services/discovery
    ports:
      - "8761:8761"

  config:
    build: ./services/config
    ports:
      - "8888:8888"
    healthcheck:
      # The JRE image has no curl; bash's /dev/tcp works as a port probe
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8888 && exec 3>&-'"]
      interval: 3s
      timeout: 3s
      retries: 20

  category:
    build: ./services/category
    expose:
      - "8081"
    environment:
      # Database and discovery config now come from the config service;
      # only its location, the instance id and credentials stay in the environment
      CONFIG_URL: http://config:8888
      CATEGORY_DB_USER: ${CATEGORY_DB_USER:-medata}
      CATEGORY_DB_PASSWORD: ${CATEGORY_DB_PASSWORD:-medata}
      INSTANCE_ID: category-1
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
    depends_on:
      category-db:
        condition: service_healthy
      discovery:
        condition: service_started
      config:
        condition: service_healthy

  # Two peer instances of the same image share one database; start order
  # between them does not matter - the Flyway lock makes migration one-time.
  lab-test-1:
    build: ./services/lab-test
    image: medata-lab-test
    expose:
      - "8082"
    environment:
      CONFIG_URL: http://config:8888
      LABTEST_DB_USER: ${LABTEST_DB_USER:-medata}
      LABTEST_DB_PASSWORD: ${LABTEST_DB_PASSWORD:-medata}
      INSTANCE_ID: lab-test-1
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
    depends_on:
      lab-test-db:
        condition: service_healthy
      discovery:
        condition: service_started
      config:
        condition: service_healthy

  lab-test-2:
    image: medata-lab-test
    expose:
      - "8082"
    environment:
      CONFIG_URL: http://config:8888
      LABTEST_DB_USER: ${LABTEST_DB_USER:-medata}
      LABTEST_DB_PASSWORD: ${LABTEST_DB_PASSWORD:-medata}
      INSTANCE_ID: lab-test-2
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
    depends_on:
      lab-test-db:
        condition: service_healthy
      discovery:
        condition: service_started
      config:
        condition: service_healthy

  category-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: category
      POSTGRES_USER: ${CATEGORY_DB_USER:-medata}
      POSTGRES_PASSWORD: ${CATEGORY_DB_PASSWORD:-medata}
    volumes:
      - category-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  lab-test-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: labtest
      POSTGRES_USER: ${LABTEST_DB_USER:-medata}
      POSTGRES_PASSWORD: ${LABTEST_DB_PASSWORD:-medata}
    volumes:
      - lab-test-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  category-db-data:
  lab-test-db-data:
