name: Build

on:
  push:
    branches: [main]
    paths: ['services/**', 'web/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['services/**', 'web/**', '.github/workflows/build.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [category, lab-test, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build ${{ matrix.service }}
        run: ./mvnw --batch-mode verify
        working-directory: services/${{ matrix.service }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/catalog/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web/catalog
      - name: Lint
        run: npx ng lint
        working-directory: web/catalog
      - name: Build
        run: npm run build
        working-directory: web/catalog

